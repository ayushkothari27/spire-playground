# SPIRE agent: runs on each machine, identifies local processes and hands them certs.
agent {
    # Where to find the SPIRE server (Docker Compose service name).
    server_address = "spire-server"
    server_port    = "8081"

    # Must match the server's trust domain.
    trust_domain = "example.org"

    # Stores the agent's own identity so it survives restarts.
    data_dir  = "/opt/spire/data/agent"
    log_level = "INFO"

    # Workloads ask for their certs over this Unix socket (the "Workload API").
    # It's on a shared volume so the demo containers can reach it.
    socket_path = "/run/spire/sockets/agent.sock"

    # The server's CA cert, so the agent can trust the server on first contact.
    # scripts/up.sh writes this file.
    trust_bundle_path = "/opt/spire/conf/agent/bootstrap.crt"
}

plugins {
    # Must match the server's node attestor; the token is passed on the command line.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # Keeps the agent's private keys in memory only.
    KeyManager "memory" {
        plugin_data {}
    }

    # Identifies a calling process by its Unix user ID (gives selectors like unix:uid:1001).
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}

# Lets `spire-agent healthcheck` (used by Docker Compose) check the agent is up.
health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
}
