# SPIRE server: the certificate authority that decides who gets which identity.
server {
    # Address agents connect to.
    bind_address = "0.0.0.0"
    bind_port    = "8081"

    # Every SPIFFE ID issued here starts with spiffe://example.org/...
    trust_domain = "example.org"

    # Where the server keeps its database and keys (a Docker volume).
    data_dir  = "/opt/spire/data/server"
    log_level = "INFO"

    # Lifetime of the server's own signing CA.
    ca_ttl = "24h"

    # Workload certs live 1 minute so you can watch them rotate (real setups use ~1h).
    default_x509_svid_ttl = "1m"

    # The agent's own cert lives longer to keep the logs quiet.
    agent_ttl = "1h"

    # JWT-SVIDs live 2 minutes, so a stolen token stops working soon (see the README exercise).
    default_jwt_svid_ttl = "2m"
}

plugins {
    # Stores registration entries and agent records in a local SQLite file.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # Agents prove who they are with a one-time join token (simplest option for demos).
    # In the cloud you'd use aws_iid, gcp_iit, k8s_psat, etc. instead.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # Keeps the server's signing keys on disk so they survive restarts.
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}

# Lets `spire-server healthcheck` (used by Docker Compose) check the server is up.
health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
}
