# Just a SPIRE server and agent. You register and fetch identities by hand (see README).
# Start with ./scripts/up.sh. It creates the trust bundle and join token the agent needs.
services:
  # The SPIRE server: issues identities and holds the list of registration entries.
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.14.0
    # Run as root to avoid volume permission issues in this local demo.
    user: "0"
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./conf/server:/opt/spire/conf/server:ro
      # Keeps the database and keys across restarts.
      - server-data:/opt/spire/data/server
    # The agent waits until this check passes.
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 2s
      retries: 30

  # The SPIRE agent: proves itself to the server, then gives certs to local processes.
  # You'll run `spire-agent api fetch` inside this container as different users.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.14.0
    # JOIN_TOKEN comes from .env (written by up.sh); it can only be used once.
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${JOIN_TOKEN:-run-scripts-up-sh}"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./conf/agent:/opt/spire/conf/agent:ro
      # Keeps the agent's identity so a restart doesn't need a new join token.
      - agent-data:/opt/spire/data/agent
      # Fetched certs are written here so you can inspect them on your Mac.
      - ./out:/out
    healthcheck:
      # Checks the agent through its Workload API socket.
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 2s
      retries: 30

# Named Docker volumes, deleted by scripts/down.sh.
volumes:
  server-data:
  agent-data:
